<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
    <title>el traductor de la muerte</title>
    <style>
        h3 {
            border: 2px solid rgb(189, 189, 189);
        }
        #la {
            display: inline;
            font-weight: normal;
        }
        #fr {
            height: 30px;
            width: 400px;
            padding: 8px;
            font-size: 1rem;
        }
        #go {
            height: 50px;
            width: 100px;
            padding: 8px;
            font-size: 1rem;
        }
    </style>
  </head>
  <body style="background-color: rgb(37, 37, 37);">
    <input id="fr" placeholder="Texte français…" />
    <button id="go">Traduire</button>
    <h3>
      la traduction :
      <span id="la"></span>
    </h3>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const btn     = document.getElementById("go");
        const frInput = document.getElementById("fr");
        const laSpan  = document.getElementById("la");

        btn.addEventListener("click", async () => {
          const fr = frInput.value.trim();
          console.log("Appel API pour:", fr);
          const la = await window.api.translate(fr);
          console.log("Réponse LATIN:", la);
          laSpan.innerText = la || "— pas de traduction —";
        });
      });
    </script>
  </body>
</html>
